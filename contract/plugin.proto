// Nilda plugin contract v2 (SPEC_98). The single source of truth for the Core<->plugin gRPC wire.
//
// Versioning: this contract is carried by plugin-sdk (semver) and guarded by the go-plugin handshake
// ProtocolVersion (Terraform-style) — an incompatible plugin is rejected at load, never silently
// broken. Within a version, fields are only ever ADDED (proto3 forward compatibility); a breaking
// change ships a new package, which is what v2 is.
//
// WHAT CHANGED IN v2, and why it is worth a breaking change: v1's HostService carried five read
// methods and no way to write anything, so a plugin could read a page by slug and list a content type
// and nothing else. No shop could create a product, no importer could create a post — not because
// out-of-process plugins are limited, but because that hand-picked subset was all anything had wired.
// Meanwhile Core has a complete API. v2 removes the subset and hands the plugin a scoped token onto
// that API instead.
//
// The resulting rule is worth stating plainly, because it is the shape of the whole system:
//
//     gRPC is how Core calls the plugin.  HTTP is how the plugin calls Core.
//
// Direction 1 — PluginService (Core -> plugin): lifecycle + hook/event dispatch. Every call is made
// with the per-call timeout (PLUGIN_CALL_TIMEOUT); a slow plugin fails the CALL, never Core.
// Direction 2 — HostService (plugin -> Core, over the go-plugin GRPCBroker): what genuinely belongs on
// this transport — the plugin's own KV namespace and event emission. Capability-enforced server-side
// (deny-by-default); the broker connection belongs to exactly one plugin, so its identity is ambient
// and unforgeable. Data access is not here; it is the API token in InitRequest.
syntax = "proto3";

package nilda.plugin.v2;

option go_package = "gitlab.com/nilda-sdk/plugin-sdk/contract";

// ============================== Core -> plugin ==============================

service PluginService {
  // Init hands the plugin its runtime context exactly once after the handshake: the granted
  // capabilities, its scoped datastore DSN (empty unless granted+provisioned), and the broker
  // stream id where Core serves HostService. The plugin answers with what it wants wired:
  // hook names, event subscriptions, and (route plugins) its resident HTTP address.
  rpc Init(InitRequest) returns (InitResponse);

  // HandleHook dispatches one hook invocation. Filter-style: the (possibly modified) payload is
  // returned; a plugin that doesn't modify echoes the payload back.
  rpc HandleHook(HookRequest) returns (HookResponse);

  // HandleEvent delivers one event (best-effort, timeout-bounded; delivery guarantees are a
  // documented SPEC_98 bound — at-least-once/replay is a later SPEC).
  rpc HandleEvent(EventRequest) returns (EventResponse);

  // Health is the supervision probe.
  rpc Health(HealthRequest) returns (HealthResponse);
}

message InitRequest {
  string plugin_key = 1;                    // the manifest key (also schema/KV slug)
  string nilda_version = 2;                 // the running Core version
  repeated string granted_capabilities = 3; // deny-by-default: only these are callable
  string datastore_dsn = 4;                 // scoped least-privilege DSN; empty unless `datastore`
  string kv_namespace = 5;                  // informational (KV ops go through HostService)
  uint32 host_broker_id = 6;                // GRPCBroker stream id serving HostService

  // How the plugin reaches Core's own API. This is the plugin's route to reading and writing real data:
  // gRPC is how Core calls the plugin, HTTP is how the plugin calls Core. Before this existed the plugin
  // side of the contract carried five hand-picked read methods and no way to write anything, so no
  // application-class plugin — a shop, a booking system — could be built at all.
  //
  // The token is scoped from the granted capabilities and rotated on every launch, so the only valid
  // credential at any moment is the one held by the process Core just started. Empty when the plugin
  // declared nothing that implies API access.
  string api_base_url = 7;
  string api_token = 8;
  repeated string api_scopes = 9; // what the token may attempt, so a plugin can fail fast on its own

  // The values the site owner typed on this plugin's declared admin pages, as a JSON object.
  //
  // JSON rather than map<string,string> because a settings field has a TYPE — a boolean that arrives as
  // "true" and a number that arrives as "5" put the parsing back on every plugin author, and they would
  // each get it slightly wrong.
  //
  // SECRETS ARE IN HERE IN PLAINTEXT, and that is the whole point: the process that has to call the payment
  // gateway is the one that needs the key. It never travels to the browser — the admin screen is told only
  // that a value is configured. The channel is AutoMTLS between Core and a child it just launched.
  //
  // Delivered at Init and never updated in place: Core RESTARTS the plugin when its settings are saved, so
  // a running plugin can never be holding a credential the owner has already replaced.
  bytes settings_json = 10;

  // The version this plugin last COMPLETED an Init at, or empty on a fresh install.
  //
  // Adding a column or a table already happens through the manifest declaration — Core applies it on
  // update, additively and idempotently. What this is for is the DATA half: filling a new column from an
  // old one, normalising a stored value, re-keying a row. Without it a plugin could not tell a first run
  // from an upgrade, so a one-time step had to run on every launch or the author had to invent a private
  // version table.
  //
  // Recorded by Core on COMPLETION, so a plugin the supervisor restarts after a crash is told it is running
  // the same version it already initialised at, and the one-time step does not run twice.
  string previous_version = 11;
}

message InitResponse {
  string route_addr = 1;      // "host:port" of the plugin's resident HTTP server; empty unless `route`
  repeated string hooks = 2;  // hook names to receive (requires `hooks` capability)
  repeated string events = 3; // event types to receive (requires `events` capability)

  // Work Core should run on a schedule and call back for (requires `schedule`). A plugin process is
  // resident and could run its own ticker, but Core-owned scheduling is visible to the site owner,
  // survives a restart, and does not double-fire when a plugin is relaunched.
  repeated Schedule schedules = 4;

  // What this plugin can DO, in a form an AI agent can read (requires `abilities`). Core turns each into
  // an ordinary agent tool named "<plugin_key>.<name>", subject to the same connector class ceiling,
  // allowlist and confirmation gates as a built-in one.
  //
  // Without this, the only actions an agent knows about are the ones Core itself ships: a shop plugin
  // could register a product all day and "add these fifty products" had nothing to call.
  repeated Ability abilities = 5;
}

// Ability is one action the plugin offers an AI agent.
message Ability {
  string name = 1;         // lowercase id within the plugin, e.g. "create_product"
  string label = 2;        // human-readable, for the admin's tool list
  string description = 3;  // what the MODEL reads to decide whether this is the right tool — be specific
  // Risk class, matching Core's agent guardrails: read | additive | write | publish | structural |
  // destructive | access | infra. A class Core does not recognise is treated as the MOST restricted one,
  // never the least — so a typo costs an owner one permission click, not an unguarded action.
  string class = 4;
  string input_schema = 5; // JSON Schema object describing the arguments; required
  bool read_only = 6;      // advisory MCP annotation; the gates are driven by `class`, not by this
}

message Schedule {
  string name = 1; // stable identifier; Core calls back with hook "schedule:<name>"
  string cron = 2; // standard cron spec
}

message HookRequest {
  string hook = 1;
  bytes payload = 2; // JSON
}

message HookResponse {
  bytes payload = 1; // JSON, possibly modified (filter hooks)
}

message EventRequest {
  string type = 1;
  bytes data_json = 2;
}

message EventResponse {}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
}

// ============================== plugin -> Core ==============================

service HostService {
  // Data access is NOT here. It used to be — five read methods (ContentSite, ContentPageBySlug,
  // ContentList, UserByID, MediaByID) and no way to write anything — and that subset was the reason no
  // application-class plugin could be built on Nilda. It has been replaced by a scoped token onto Core's
  // own /api/v1, which every first-party feature and external integration already uses: create, edit,
  // publish, schedule, delete, media, import, GraphQL, filtering. See InitRequest.api_token.
  //
  // Keeping a second, thinner data API here would mean maintaining two, and the thin one would lose.
  // What remains is what genuinely belongs on this transport: state Core holds for the plugin alone, and
  // events flowing back into Core's pipeline.
  //
  // (Protocol version 2. The removed methods have no reserved marker because gRPC identifies methods by
  // name, not number — a plugin built against v1 is rejected at the handshake, not silently mismatched.)

  // kv — the plugin's scoped Dragonfly namespace.
  rpc KVGet(KVGetRequest) returns (KVGetResponse);
  rpc KVSet(KVSetRequest) returns (KVSetResponse);
  rpc KVDel(KVDelRequest) returns (KVDelResponse);
  rpc KVIncr(KVIncrRequest) returns (KVIncrResponse);

  // events — emit a plugin-originated event into Core's pipeline.
  rpc EmitEvent(EmitEventRequest) returns (EmitEventResponse);

  // email — send mail through Core's mailer (requires `email`). Core fixes the sender identity, so a
  // plugin can never forge the site's address; a booking plugin sends its own confirmations without
  // needing SMTP credentials of its own, and without the owner configuring mail twice.
  rpc SendEmail(SendEmailRequest) returns (SendEmailResponse);

  // auth — end every session of somebody an identity provider has deprovisioned (requires
  // `auth_provider`).
  //
  // THE ONE ASYMMETRY WORTH STATING OUTRIGHT: a plugin may never create authority, and may destroy it.
  //
  // Nothing on this service lets a plugin sign anybody in — that is the whole shape of `auth_provider`,
  // where the plugin returns an assertion and Core decides. This method is the mirror image, and it is
  // safe for exactly that reason: the worst a hostile plugin achieves with it is signing people out.
  //
  // It is also what makes SSO mean what it claims. "Someone leaves the company and their access here ends
  // in the same second" cannot be delivered by anything that only runs at sign-in; it needs the directory
  // to be able to reach in. The provider's back-channel logout token arrives on the plugin's own route,
  // the plugin validates it, and this is how it tells Core.
  //
  // Core enforces ownership: `provider` is your LOCAL key, and a plugin can only ever revoke identities
  // recorded under a provider it owns.
  rpc RevokeIdentity(RevokeIdentityRequest) returns (RevokeIdentityResponse);
}

message RevokeIdentityRequest {
  // provider is your LOCAL key, as declared in your manifest. Core namespaces it.
  string provider = 1;
  // subject is the identity provider's `sub` for the person — the same value your assertion carried.
  string subject = 2;
  // reason is recorded in the audit trail so an administrator reading it later learns WHY somebody was
  // signed out, e.g. "back-channel logout from acme.okta.com".
  string reason = 3;
}

message RevokeIdentityResponse {
  // sessions_ended is how many were actually revoked. Zero is not an error: the person may simply not
  // have been signed in.
  int32 sessions_ended = 1;
}

message SendEmailRequest {
  string to = 1;
  string subject = 2;
  string body = 3;
}

message SendEmailResponse {}

message KVGetRequest {
  string key = 1;
}

message KVGetResponse {
  string value = 1;
  bool found = 2;
}

message KVSetRequest {
  string key = 1;
  string value = 2;
  int64 ttl_seconds = 3; // 0 = no expiry
}

message KVSetResponse {}

message KVDelRequest {
  string key = 1;
}

message KVDelResponse {}

message KVIncrRequest {
  string key = 1;
}

message KVIncrResponse {
  int64 value = 1;
}

message EmitEventRequest {
  string type = 1;
  bytes data_json = 2;
}

message EmitEventResponse {}
